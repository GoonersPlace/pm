name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ ninja-build qt6-base-dev qt6-httpserver-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
